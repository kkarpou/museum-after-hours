<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e0d">
<title>Όταν κλείνουν οι αίθουσες — Mobile</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a09;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 76px;background:#080a09}#game{width:100%;height:100%;border:0;display:block;background:#080a09}#touchbar{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;padding:1px calc(1px + env(safe-area-inset-right)) calc(1px + env(safe-area-inset-bottom)) calc(1px + env(safe-area-inset-left));background:#343a36;border-top:1px solid #535b55;z-index:100}.touch{appearance:none;border:0;background:#121614;color:#e8e5dc;min-width:0;min-height:58px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.touch:active{background:#303731;transform:translateY(1px)}.touch.primary{background:#443b24;color:#f2d98f}.touch .icon{font-size:1.4rem;line-height:1;font-weight:800}.touch .label{font-size:.68rem;line-height:1;white-space:nowrap}@media(max-width:390px){.touch .label{font-size:.6rem}.touch .icon{font-size:1.25rem}}@media(orientation:landscape) and (max-height:600px){#shell{grid-template-rows:minmax(0,1fr) 58px}.touch{min-height:48px;flex-direction:row;gap:4px}.touch .icon{font-size:1.05rem}.touch .label{font-size:.63rem}}
</style>
</head>
<body>
<div id="shell">
<iframe id="game" src="./" title="Όταν κλείνουν οι αίθουσες" allow="autoplay; fullscreen"></iframe>
<nav id="touchbar" aria-label="Χειρισμός παιχνιδιού">
<button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button>
<button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button>
<button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button>
<button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button>
<button class="touch" data-key="y"><span class="icon">?</span><span class="label">Hint</span></button>
<button class="touch" data-key="x"><span class="icon">↻</span><span class="label">Φωνή</span></button>
</nav>
</div>
<script>
const frame=document.getElementById('game');
const mobileCSS=String.raw`
html{height:100%!important;overflow:hidden!important}
body{height:100%!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:contain!important;touch-action:pan-y!important;padding:0!important}
#app{height:auto!important;min-height:100%!important;display:block!important;overflow:visible!important}
.topbar{position:sticky!important;top:0!important;z-index:30!important;min-height:44px!important;padding:0 12px!important;background:rgba(10,13,12,.98)!important}.brand{font-size:.76rem!important;letter-spacing:.08em!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.status,.controls{display:none!important}
main{display:block!important;height:auto!important;min-height:calc(100dvh - 44px)!important;overflow:visible!important;padding:8px!important}#stage{width:100%!important;height:auto!important;min-height:calc(100dvh - 60px)!important;overflow:visible!important}.card{height:auto!important;min-height:calc(100dvh - 60px)!important;overflow:visible!important}
.hero{min-height:calc(100dvh - 60px)!important;padding:28px 18px!important}.hero h1{font-size:clamp(2.85rem,14vw,4.8rem)!important;line-height:.95!important}.hero p{font-size:1.08rem!important;line-height:1.45!important}.startprompt{font-size:1rem!important;padding:12px 15px!important}
.scene,.dialogue,.strategy,.interlude{grid-template-columns:1fr!important;height:auto!important;min-height:0!important;overflow:visible!important}.art{height:38dvh!important;min-height:250px!important;border-right:0!important;border-bottom:1px solid var(--line)!important}.art img{object-fit:contain!important}.content,.voicepane{height:auto!important;overflow:visible!important;padding:18px 16px 30px!important}h2{font-size:clamp(2rem,8vw,2.85rem)!important;line-height:1.05!important}.kicker,.eyebrow{font-size:.78rem!important}.meta{font-size:.92rem!important;line-height:1.3!important}.bodycopy{font-size:1.08rem!important;line-height:1.42!important}
.options{height:auto!important;overflow:visible!important;gap:9px!important;margin-top:12px!important}.option{min-height:56px!important;padding:12px 10px!important;font-size:1.06rem!important;line-height:1.22!important;touch-action:manipulation!important}.option small{display:block!important;font-size:.84em!important;line-height:1.18!important;margin-top:3px!important}.option.focused{transform:none!important;outline-width:2px!important}.note{font-size:.98rem!important;line-height:1.34!important;padding:10px 11px!important}.badges{display:flex!important}.badge{font-size:.78rem!important}.advisor{display:flex!important;font-size:.92rem!important;line-height:1.28!important}.subtitle{font-size:clamp(1.6rem,7vw,2.35rem)!important;line-height:1.22!important}.voicehint{font-size:1rem!important;line-height:1.4!important}.voicepane{justify-content:flex-start!important}
.team-screen,.exhibit-review,.score{height:auto!important;min-height:0!important;display:block!important;overflow:visible!important;padding:18px 14px 32px!important}.team-head{grid-template-columns:1fr!important;gap:12px!important}.teamgrid{display:grid!important;grid-template-columns:1fr!important;grid-auto-rows:auto!important;gap:12px!important;margin-top:16px!important;height:auto!important;overflow:visible!important}.person{min-height:0!important;height:auto!important;grid-template-columns:118px 1fr!important;grid-template-rows:auto!important;align-items:stretch!important;overflow:hidden!important}.person-art{height:148px!important;min-height:148px!important;width:118px!important;overflow:hidden!important;border-right:1px solid var(--line)!important}.person-art img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 20%!important}.person h3{font-size:1.28rem!important;line-height:1.1!important}.person p{font-size:.96rem!important;line-height:1.3!important}.role-tag{font-size:.76rem!important}
.strategy{padding:20px 16px 32px!important;gap:16px!important}.manifesto{font-size:1.08rem!important;line-height:1.42!important}.interlude{padding:26px 18px 32px!important;gap:18px!important}.clock{font-size:4.4rem!important;text-align:left!important;margin-top:4px!important}.interlude blockquote{font-size:1.16rem!important}.reviewhead{display:block!important}.reviewgrid{grid-template-columns:1fr!important;grid-template-rows:auto!important;gap:8px!important;margin:16px 0!important;height:auto!important;overflow:visible!important}.reviewitem{min-height:82px!important;height:auto!important;overflow:visible!important}.reviewitem strong{font-size:1.12rem!important}.reviewitem small{font-size:.82rem!important}
.score{padding:16px 12px 36px!important}.scoretop{display:grid!important;grid-template-columns:112px 1fr!important;gap:14px!important;align-items:center!important;border:1px solid #4c504b!important;background:linear-gradient(145deg,#202523,#151918)!important;padding:14px!important;margin-bottom:12px!important}.totalscore{font-size:3.8rem!important;text-align:center!important;line-height:.9!important;margin:0!important}.totalscore small{display:block!important;margin-top:7px!important;font-size:.72rem!important;line-height:1.1!important}.scoretop h2{font-size:1.8rem!important;margin:0 0 5px!important}.scoretop p{line-height:1.35!important}.scoregrid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;margin:10px 0 14px!important}.scorecard{min-height:94px!important;padding:12px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;border:1px solid #4b514c!important;background:linear-gradient(160deg,#242a27,#1b201e)!important}.scorecard strong{font-size:1.75rem!important;line-height:1!important;margin-bottom:6px!important}.scorecard span{font-size:.72rem!important;line-height:1.15!important}.results{display:grid!important;grid-template-columns:1fr!important;gap:12px!important}.panel{height:auto!important;overflow:visible!important;padding:14px!important;border:1px solid #454b47!important;background:#171b1a!important}.panel h3{font-size:.82rem!important;margin:0 0 8px!important;line-height:1.2!important}.panel p{font-size:.96rem!important;line-height:1.38!important}.minirow{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;margin-top:10px!important;height:auto!important;overflow:visible!important}.team-feedback{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;height:auto!important;overflow:visible!important}.mini{min-height:62px!important;padding:9px 10px!important;font-size:.84rem!important;line-height:1.28!important;background:#202523!important;border:1px solid #3c433e!important}.mini strong{display:block!important;margin-bottom:4px!important;font-size:.9rem!important;line-height:1.15!important}.code{display:inline-block!important;margin-top:5px!important;padding:5px 7px!important;background:#101311!important;border:1px solid #3c433e!important;font-size:.9rem!important;line-height:1.15!important}
/* debrief: single-column cards that expand with content */
.debrief{display:flex!important;flex-direction:column!important;grid-template-columns:none!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;gap:10px!important;padding:16px 12px 36px!important}
.debrief>*{width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;min-height:0!important;max-height:none!important;box-sizing:border-box!important}
.qcard,.teacher-note{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;padding:12px!important;margin:0!important;box-sizing:border-box!important}
.qcard{font-size:.98rem!important;line-height:1.36!important}.teacher-note{font-size:.9rem!important;line-height:1.38!important}.qcard h2,.qcard h3,.qcard h4,.teacher-note h2,.teacher-note h3,.teacher-note h4{font-size:.9rem!important;line-height:1.2!important;margin:0 0 7px!important;overflow-wrap:anywhere!important}.qcard p,.teacher-note p,.qcard li,.teacher-note li{font-size:.94rem!important;line-height:1.36!important;overflow-wrap:anywhere!important;word-break:normal!important}.qcard ul,.qcard ol,.teacher-note ul,.teacher-note ol{margin:.45rem 0 0!important;padding-left:1.15rem!important}.debrief [class*="grid"]{grid-template-columns:1fr!important;grid-auto-rows:auto!important;height:auto!important;min-height:0!important;overflow:visible!important;gap:10px!important}
.modal{align-items:end!important;padding:0!important}.modalbox{width:100%!important;max-width:none!important;max-height:82dvh!important;overflow:auto!important;-webkit-overflow-scrolling:touch!important;border-radius:16px 16px 0 0!important;padding:18px 16px calc(18px + env(safe-area-inset-bottom))!important}.modalbody{font-size:1.04rem!important}.modalclose{min-height:48px!important;font-size:1rem!important}.night-toast{max-width:calc(100vw - 24px)!important;font-size:.94rem!important}
@media(max-width:360px){.scoretop{grid-template-columns:1fr!important;text-align:left!important}.totalscore{text-align:left!important;font-size:3.4rem!important}.minirow{grid-template-columns:1fr!important}.debrief{padding-left:8px!important;padding-right:8px!important}.qcard,.teacher-note{padding:10px!important}}
@media(orientation:landscape) and (max-height:600px){.topbar{min-height:38px!important}main{padding:5px!important}.scene,.dialogue{grid-template-columns:40% 60%!important;align-items:start!important}.scene .art,.dialogue .art{height:calc(100dvh - 44px)!important;min-height:0!important;position:sticky!important;top:38px!important;border-right:1px solid var(--line)!important;border-bottom:0!important}.content,.voicepane{padding:12px 14px 24px!important}h2{font-size:1.85rem!important}.bodycopy{font-size:.98rem!important}.option{font-size:.96rem!important;min-height:48px!important;padding:9px!important}.subtitle{font-size:1.45rem!important}.teamgrid{grid-template-columns:1fr 1fr!important;gap:10px!important}.person{grid-template-columns:90px 1fr!important;grid-template-rows:auto!important}.person-art{width:90px!important;height:112px!important;min-height:112px!important}.scoretop{grid-template-columns:150px 1fr!important}.scoregrid{grid-template-columns:repeat(4,1fr)!important}.results{grid-template-columns:1.12fr .88fr!important}.minirow{grid-template-columns:repeat(3,1fr)!important}.debrief{display:flex!important;flex-direction:column!important}.debrief [class*="grid"]{grid-template-columns:1fr!important}}
`;
function sendKey(key){const w=frame.contentWindow;if(!w)return;try{w.focus();w.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}catch(e){}}
document.querySelectorAll('.touch').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();sendKey(btn.dataset.key)}));
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const style=d.createElement('style');style.id='mobile-overrides';style.textContent=mobileCSS;d.head.appendChild(style);const prompt=d.querySelector('.startprompt');if(prompt)prompt.textContent='ΠΑΤΗΣΕ «ΕΠΙΛΟΓΗ» ΓΙΑ ΕΝΑΡΞΗ';const stage=d.getElementById('stage');if(stage){new MutationObserver(()=>{d.body.scrollTop=0;d.documentElement.scrollTop=0;const p=d.querySelector('.startprompt');if(p)p.textContent='ΠΑΤΗΣΕ «ΕΠΙΛΟΓΗ» ΓΙΑ ΕΝΑΡΞΗ'}).observe(stage,{childList:true})}}catch(e){console.error(e)}});
</script>
</body>
</html>
