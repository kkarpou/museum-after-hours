<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e0d"><title>Όταν κλείνουν οι αίθουσες</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a09;font-family:"Segoe UI",Tahoma,Arial,system-ui,sans-serif}#game{width:100%;height:100%;border:0;display:block;background:#080a09}</style></head><body><iframe id="game" src="./?museumWrapper=1" title="Όταν κλείνουν οι αίθουσες" allow="autoplay; fullscreen"></iframe><script>
const frame=document.getElementById('game');let STR={};const seen=new WeakSet();
function tr(s){const t=String(s??''),z=t.trim();if(Object.prototype.hasOwnProperty.call(STR,z)){const a=t.match(/^\s*/)?.[0]||'',b=t.match(/\s*$/)?.[0]||'';return a+STR[z]+b}return t}
function localizeNode(node){if(!node||seen.has(node))return;if(node.nodeType===Node.TEXT_NODE){const p=node.parentElement;if(!p||p.closest('script,style')){seen.add(node);return}node.nodeValue=tr(node.nodeValue);seen.add(node);return}if(node.nodeType!==Node.ELEMENT_NODE)return;const w=node.ownerDocument.createTreeWalker(node,NodeFilter.SHOW_TEXT),arr=[];while(w.nextNode())arr.push(w.currentNode);arr.forEach(localizeNode)}
function patch(){try{const d=frame.contentDocument,w=frame.contentWindow;const style=d.createElement('style');style.id='museum-font-fix';style.textContent=`html,body,#app,button,input,select,textarea,h1,h2,h3,h4,.hero p,.bodycopy,.subtitle,.manifesto,.totalscore,.scorecard strong,.modalbox h3,.person h3,.interlude blockquote,.qcard,.teacher-note{font-family:"Segoe UI",Tahoma,Arial,system-ui,-apple-system,sans-serif!important}h1,h2,.subtitle,.totalscore,.person h3{font-weight:600!important;letter-spacing:0!important}.hero p,.bodycopy,.subtitle,.manifesto{font-feature-settings:"kern" 1,"liga" 1!important;text-rendering:optimizeLegibility!important}`;d.head.appendChild(style);localizeNode(d.body);const stage=d.getElementById('stage');if(stage){new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)localizeNode(n)}).observe(stage,{childList:true,subtree:true})}const modal=d.getElementById('modal');if(modal){new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)localizeNode(n)}).observe(modal,{childList:true,subtree:true})}const nativeAlert=w.alert.bind(w);w.alert=m=>nativeAlert(tr(m))}catch(e){console.error(e)}}
Promise.all([fetch('./museum/i18n/strings-el.json?v=1',{cache:'no-store'}).then(r=>r.json()).catch(()=>({strings:{}}))]).then(([x])=>{STR=x.strings||{};if(frame.contentDocument?.readyState==='complete')patch()});frame.addEventListener('load',patch);
</script></body></html>
