<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0d">
<title>The Music Files — Mobile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 72px}#game{width:100%;height:100%;border:0;background:#080a0d}.touchbar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#333c45;padding:1px 1px calc(1px + env(safe-area-inset-bottom));border-top:1px solid #56616d}.touch{border:0;background:#10151a;color:#eef2f5;min-width:0;padding:5px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;touch-action:manipulation}.touch.primary{background:#17303a;color:#77e2ff}.icon{font-size:1.3rem;font-weight:900;line-height:1}.label{font-size:.65rem;line-height:1;white-space:nowrap}@media(orientation:landscape) and (max-height:600px){#shell{grid-template-rows:minmax(0,1fr) 54px}.touch{flex-direction:row;gap:4px}.icon{font-size:1rem}.label{font-size:.62rem}}
</style>
</head>
<body>
<div id="shell"><iframe id="game" src="./" title="The Music Files" allow="autoplay; fullscreen"></iframe><nav class="touchbar"><button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button><button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button><button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button><button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button><button class="touch" data-key="h"><span class="icon">?</span><span class="label">Hint</span></button></nav></div>
<script>
const frame=document.getElementById('game');
const css=String.raw`
html{height:100%!important;overflow:hidden!important}body{height:100%!important;overflow:auto!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important}#app{height:auto!important;min-height:100%!important;display:block!important}.topbar{position:sticky!important;top:0!important;z-index:30!important;height:42px!important;padding:0 10px!important}.brand{font-size:.68rem!important}.status{font-size:.7rem!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;max-width:58vw!important}main{display:block!important;height:auto!important;overflow:visible!important;padding:7px!important}.stage{height:auto!important;min-height:calc(100dvh - 52px)!important;overflow:visible!important}.card{height:auto!important;min-height:calc(100dvh - 52px)!important;overflow:visible!important}.controls{display:none!important}.center{min-height:calc(100dvh - 52px)!important;padding:24px 14px!important}.title{font-size:clamp(3rem,17vw,5rem)!important}.subtitle{font-size:1rem!important}.prompt{font-size:.86rem!important}.casefile{grid-template-columns:1fr!important;height:auto!important}.sidebar{border-right:0!important;border-bottom:1px solid var(--line)!important;padding:14px!important}.sidebar .cover-main{max-width:280px!important;width:72vw!important;margin:0 auto!important}.sidebar h2{font-size:1.8rem!important}.screen{padding:14px!important;overflow:visible!important;height:auto!important}.screen h2{font-size:1.8rem!important}.screenhead{display:block!important}.screenhead p{font-size:.9rem!important;margin-top:5px!important}.copy{font-size:.98rem!important}.covers{grid-template-columns:1fr 1fr!important;height:auto!important;overflow:visible!important}.covercard{padding:7px!important}.covermeta,.match{font-size:.72rem!important}.options{height:auto!important;overflow:visible!important}.screen>.options[style*="repeat(5"]{grid-template-columns:1fr!important}.option{min-height:54px!important;padding:10px!important;font-size:.96rem!important;transform:none!important}.statement-grid{grid-template-columns:1fr!important;height:auto!important}.networkwrap{grid-template-columns:1fr!important;height:auto!important}.network{height:56vh!important;min-height:360px!important}.legend{overflow:visible!important}.timeline{grid-template-columns:1fr!important;height:auto!important}.event{min-height:0!important}.report{grid-template-columns:1fr!important;height:auto!important}.scorebig{font-size:4rem!important}.conclusion h2{font-size:2rem!important}
@media(orientation:landscape) and (max-height:600px){.casefile{grid-template-columns:34% 66%!important}.sidebar{border-right:1px solid var(--line)!important;border-bottom:0!important;position:sticky!important;top:42px!important;align-self:start!important}.sidebar .cover-main{width:100%!important}.covers{grid-template-columns:repeat(4,1fr)!important}.networkwrap{grid-template-columns:minmax(0,1fr) 240px!important}.network{height:75vh!important}.statement-grid{grid-template-columns:repeat(3,1fr)!important}.timeline{grid-template-columns:repeat(4,1fr)!important}.report{grid-template-columns:230px 1fr!important}}
`;
function sendKey(key){try{frame.contentWindow.focus();frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}catch(e){}}
document.querySelectorAll('.touch').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();sendKey(b.dataset.key)}));
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const s=d.createElement('style');s.textContent=css;d.head.appendChild(s);const st=d.getElementById('stage');if(st)new MutationObserver(()=>{d.body.scrollTop=0;d.documentElement.scrollTop=0}).observe(st,{childList:true})}catch(e){console.error(e)}});
</script>
</body>
</html>
