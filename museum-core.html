<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Όταν κλείνουν οι αίθουσες — Large Text</title>
<style>
:root{
  --bg:#0c1010;--panel:#171c1b;--panel2:#202624;--ink:#f2efe7;--muted:#aaa99f;
  --gold:#d9b86c;--gold2:#f2d99c;--line:#3a403c;--good:#8cc9a7;--bad:#d9938f;
  --shadow:0 18px 70px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 8%,#1b211f 0,#0d1110 42%,#080a0a 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit}
#app{height:100dvh;display:grid;grid-template-rows:42px minmax(0,1fr) 48px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(10,13,12,.94);min-height:0}
.brand{font-size:clamp(.78rem,1vw,.95rem);letter-spacing:.13em;font-weight:800;color:var(--gold2)}
.status{display:flex;gap:16px;font-size:clamp(.94rem,1.15vw,1.08rem);color:var(--muted)}.status strong{color:var(--ink)}
main{min-height:0;overflow:hidden;padding:10px 16px;display:flex;align-items:stretch;justify-content:center}
#stage{width:min(1320px,100%);height:100%;min-height:0;overflow:hidden}
.card{height:100%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(31,37,35,.97),rgba(15,18,17,.98));box-shadow:var(--shadow);overflow:hidden}
.hero{display:grid;place-items:center;text-align:center;padding:clamp(18px,4vh,42px);position:relative}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,rgba(217,184,108,.035) 49%,transparent 50%);pointer-events:none}
.kicker{font-size:clamp(.74rem,.92vw,.88rem);letter-spacing:.22em;color:var(--gold);font-weight:800;text-transform:uppercase}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.5rem,5.6vw,5.2rem);line-height:.94;font-weight:500;margin:.15em 0 .18em;max-width:940px}
.hero p{max-width:780px;font-family:Georgia,serif;color:#d5d2c9;font-size:clamp(1rem,1.32vw,1.2rem);line-height:1.45;margin:0 auto clamp(12px,2.5vh,22px)}
.startprompt{display:inline-block;border:1px solid var(--gold);padding:9px 18px;color:var(--gold2);font-weight:800;font-size:clamp(.9rem,1.15vw,1.05rem);letter-spacing:.03em;animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.55}}
.scene{height:100%;display:grid;grid-template-columns:42% 58%;overflow:hidden}
.art{position:relative;background:#060808;overflow:hidden;border-right:1px solid var(--line)}
.art img{width:100%;height:100%;object-fit:contain;background:#070909;display:block;filter:saturate(.88) contrast(1.02)}
.art.night img{filter:brightness(.50) saturate(.76)}
.artcredit{position:absolute;left:10px;right:10px;bottom:8px;z-index:2;font-size:clamp(.6rem,.72vw,.7rem);line-height:1.2;background:rgba(0,0,0,.62);color:#dedbd2;padding:5px 7px}
.content{min-height:0;overflow:hidden;padding:clamp(12px,2.2vh,22px) clamp(16px,2.5vw,32px);display:flex;flex-direction:column}
.eyebrow{font-size:clamp(.72rem,.86vw,.82rem);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
h2{font-family:Georgia,serif;font-size:clamp(1.95rem,3vw,2.7rem);font-weight:500;margin:.12em 0 .08em;line-height:1.02}.meta{color:var(--muted);font-size:clamp(.8rem,.98vw,.94rem);margin-bottom:clamp(7px,1.1vh,11px)}
.bodycopy{font-family:Georgia,serif;color:#d9d6ce;font-size:clamp(.94rem,1.15vw,1.08rem);line-height:1.35;max-width:760px}.bodycopy strong{color:var(--ink)}
.progressline{height:3px;background:#292e2b;margin:7px 0 10px;position:relative;overflow:hidden}.progressline span{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0}
.options{display:grid;gap:clamp(5px,.8vh,8px);margin-top:clamp(8px,1.1vh,12px);min-height:0;overflow:hidden}
.option{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:clamp(6px,.8vh,8px) 11px;text-align:left;cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:7px;align-items:start;font-size:clamp(.96rem,1.18vw,1.1rem);line-height:1.22;min-height:0;transition:.1s}.option .num{font-weight:800;color:var(--muted)}.option small{display:block;color:var(--muted);margin-top:1px;font-size:.82em;line-height:1.12}.option.focused{outline:3px solid var(--gold);outline-offset:1px;background:#2a302d;transform:translateX(2px)}.option.done{border-color:var(--good)}
.note{margin-top:clamp(6px,1vh,10px);border-left:3px solid var(--gold);background:#222724;padding:7px 10px;color:#dedbd3;font-size:clamp(.86rem,1.02vw,.98rem);line-height:1.28}.note.hidden{display:none}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:clamp(6px,1vh,10px)}.badge{border:1px solid #505651;border-radius:999px;padding:3px 7px;color:#b9bbb4;font-size:clamp(.7rem,.84vw,.8rem)}.badge.on{border-color:var(--gold);color:var(--gold2);background:rgba(217,184,108,.08)}
.advisor{display:flex;align-items:center;gap:9px;margin-top:8px;color:var(--muted);font-size:clamp(.8rem,.96vw,.9rem)}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#343a36;border:1px solid #626861;color:var(--gold2);font-weight:800;font-size:.7rem}
.dialogue{height:100%;display:grid;grid-template-columns:44% 56%;overflow:hidden}.voicepane{padding:clamp(18px,3.3vh,32px) clamp(18px,2.8vw,36px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}.speaker{font-size:clamp(.76rem,.9vw,.86rem);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}.subtitle{font-family:Georgia,serif;font-size:clamp(1.45rem,2.35vw,2.15rem);line-height:1.22;margin:9px 0 12px;max-width:700px}.voicehint{font-size:clamp(.8rem,.96vw,.9rem);color:var(--muted);line-height:1.35}.wave{display:flex;gap:4px;height:20px;align-items:center;margin:5px 0 12px}.wave span{display:block;width:3px;background:var(--gold);height:5px}.speaking .wave span{animation:wave .75s infinite ease-in-out}.speaking .wave span:nth-child(2){animation-delay:.1s}.speaking .wave span:nth-child(3){animation-delay:.2s}.speaking .wave span:nth-child(4){animation-delay:.3s}.speaking .wave span:nth-child(5){animation-delay:.4s}@keyframes wave{50%{height:20px}}
.strategy{height:100%;padding:clamp(16px,2.8vh,28px) clamp(20px,3vw,38px);display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:center;overflow:hidden}.strategy h2{font-size:clamp(2rem,3.6vw,3rem)}.strategy .options{margin-top:0}.manifesto{font-family:Georgia,serif;color:#d7d4cb;font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.4;max-width:560px}
.score{height:100%;padding:clamp(13px,2.3vh,22px) clamp(18px,2.8vw,34px);overflow:hidden}.scoretop{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center}.totalscore{font-family:Georgia,serif;font-size:clamp(3.7rem,8vh,5.8rem);color:var(--gold2);line-height:.9}.totalscore small{font-size:1rem;color:var(--muted)}.scoretop h2{margin:0}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.scorecard{border:1px solid var(--line);background:#202523;padding:8px 10px}.scorecard strong{display:block;font-family:Georgia,serif;font-size:clamp(1.3rem,2.8vh,1.8rem);color:var(--gold2)}.scorecard span{font-size:clamp(.68rem,.8vw,.76rem);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.results{display:grid;grid-template-columns:1.12fr .88fr;gap:9px}.panel{border:1px solid var(--line);background:#171b1a;padding:9px 11px;min-height:0;overflow:hidden}.panel h3{margin:0 0 5px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:clamp(.78rem,.92vw,.88rem)}.panel p{margin:0;color:#d5d2c9;font-size:clamp(.84rem,.98vw,.94rem);line-height:1.3}.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.mini{border:1px solid #383e3a;background:#202523;padding:6px 7px;font-size:clamp(.7rem,.82vw,.8rem);line-height:1.22}.mini strong{display:block;color:var(--gold2);margin-bottom:2px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--gold2);font-size:clamp(.9rem,1.08vw,1.02rem)}
.controls{display:flex;align-items:center;justify-content:center;gap:clamp(9px,1.8vw,18px);border-top:1px solid var(--line);background:#0b0e0d;color:var(--muted);font-size:clamp(.78rem,.9vw,.86rem);min-height:0}.key{display:inline-block;min-width:23px;text-align:center;border:1px solid #555b56;border-radius:4px;color:var(--ink);font-weight:800;padding:2px 5px;margin-right:4px}.controller-ok{color:var(--good)}
.modal{position:fixed;inset:0;background:rgba(4,6,5,.82);z-index:50;display:none;place-items:center;padding:14px}.modal.open{display:grid}.modalbox{width:min(720px,94vw);max-height:74vh;overflow:hidden;background:#202522;border:1px solid #676d66;box-shadow:var(--shadow);padding:clamp(15px,2.6vh,24px)}.modalhead{display:flex;gap:10px;align-items:center}.modalbox h3{margin:0;color:var(--gold2);font-family:Georgia,serif;font-size:clamp(1.55rem,2.3vw,2rem)}.modalbody{font-size:clamp(1rem,1.18vw,1.12rem);line-height:1.4;color:#dedbd2;margin-top:8px}.modalbody p{margin:.55em 0}.modalclose{margin-top:10px;border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:7px 11px}
@media(max-width:900px){.scene,.dialogue{grid-template-columns:38% 62%}.strategy{grid-template-columns:.8fr 1.2fr}.status{display:none}.content{padding:12px 16px}.subtitle{font-size:clamp(1rem,2.2vw,1.45rem)}}
@media(max-height:700px){#app{grid-template-rows:38px minmax(0,1fr) 42px}main{padding:6px 9px}.topbar{padding:0 12px}.content{padding:8px 13px}.bodycopy{font-size:.9rem;line-height:1.2}.option{padding:5px 8px;font-size:.92rem;line-height:1.12}.option small{font-size:.76em;line-height:1.05}.note{padding:5px 8px;font-size:.82rem;line-height:1.18}.artcredit{font-size:.58rem}.voicepane{padding:12px 16px}.subtitle{font-size:clamp(1.3rem,2vw,1.7rem);line-height:1.14}.score{padding:8px 14px}.scoretop{grid-template-columns:180px 1fr}.scoregrid{margin:6px 0}.panel{padding:6px 8px}.strategy{padding:10px 16px}.badges{margin-top:4px}.advisor{margin-top:5px}}
@media(max-height:610px){.option small{display:none}.bodycopy{font-size:.84rem}.badges{display:none}.advisor{display:none}.subtitle{font-size:1.22rem}.minirow{display:none}.meta{font-size:.74rem}.artcredit{font-size:.52rem}}

/* v5 — characters, day/night arc, exhibition overview */
.team-screen{height:100%;padding:clamp(16px,2.7vh,28px) clamp(20px,3vw,38px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;overflow:hidden}
.team-head{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:end}.team-head .bodycopy{font-size:clamp(1.02rem,1.28vw,1.18rem)}
.teamgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:0}.person{border:1px solid var(--line);background:#181d1b;padding:10px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px;min-height:0}.person-art{min-height:0;background:radial-gradient(circle at 50% 20%,#39413d 0,#222825 45%,#111513 100%);display:grid;place-items:center;overflow:hidden;position:relative}.person-art img{width:100%;height:100%;object-fit:cover;display:block}.person h3{font-family:Georgia,serif;font-size:clamp(1.1rem,1.55vw,1.4rem);margin:0;color:var(--gold2);font-weight:500}.person p{margin:2px 0 0;color:var(--muted);font-size:clamp(.76rem,.9vw,.88rem);line-height:1.2}.role-tag{font-size:clamp(.64rem,.76vw,.72rem);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.interlude{height:100%;display:grid;grid-template-columns:1fr .8fr;align-items:center;gap:26px;padding:clamp(20px,4vh,48px) clamp(24px,4vw,56px);position:relative;overflow:hidden}.clock{font-family:Georgia,serif;font-size:clamp(4.4rem,10vw,8.5rem);line-height:.84;color:var(--gold2);opacity:.92}.interlude blockquote{margin:16px 0 0;border-left:3px solid var(--gold);padding:8px 14px;font-family:Georgia,serif;font-size:clamp(1.05rem,1.5vw,1.3rem);line-height:1.35;color:#ded9ca}.nightmark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 75% 20%,rgba(217,184,108,.08),transparent 30%),linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.22))}
.portrait-inline{width:50px;height:50px;flex:0 0 50px;border-radius:50%;overflow:hidden;border:1px solid #777d76;background:#262c29}.portrait-inline img{width:100%;height:100%;object-fit:cover;display:block}.advisor{font-size:clamp(.92rem,1.08vw,1.02rem)}
.exhibit-review{height:100%;padding:clamp(13px,2.2vh,22px) clamp(18px,2.8vw,34px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px;overflow:hidden}.reviewhead{display:flex;justify-content:space-between;align-items:end;gap:18px}.reviewhead h2{margin-bottom:0}.reviewgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;min-height:0}.reviewitem{border:1px solid var(--line);background:#181d1b;padding:9px 10px;display:grid;grid-template-columns:54px 1fr;gap:9px;align-items:center;overflow:hidden}.voice-orb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid #555e58;background:#111513;color:#a9aaa3;font-weight:900}.voice-orb.full{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 3px rgba(217,184,108,.08)}.reviewitem strong{font-family:Georgia,serif;font-size:clamp(.98rem,1.2vw,1.12rem);font-weight:500;color:var(--gold2);display:block}.reviewitem small{display:block;color:var(--muted);font-size:clamp(.7rem,.84vw,.8rem);line-height:1.16;margin-top:2px}.reviewitem .decision{color:#ddd8cb}
.debrief{height:100%;padding:clamp(18px,3vh,34px) clamp(22px,3.5vw,44px);display:grid;grid-template-columns:.75fr 1.25fr;gap:22px;align-items:center;overflow:hidden}.qstack{display:grid;gap:10px}.qcard{border-left:4px solid var(--gold);background:#1b201e;padding:12px 14px;font-family:Georgia,serif;font-size:clamp(1rem,1.3vw,1.18rem);line-height:1.3}.teacher-note{margin-top:12px;color:var(--muted);font-size:clamp(.82rem,.96vw,.92rem);line-height:1.3}.team-feedback{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.team-feedback .mini{min-height:88px}
@media(max-width:980px){.teamgrid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.person{grid-template-columns:105px 1fr;grid-template-rows:1fr}.person-art img{max-height:130px}.reviewgrid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}.team-feedback{grid-template-columns:repeat(2,1fr)}.debrief{grid-template-columns:1fr 1.3fr}}
@media(max-height:700px){.team-screen{padding:9px 14px}.teamgrid{gap:6px}.person{padding:6px}.person-art img{max-height:150px}.person p{font-size:.72rem}.interlude{padding:14px 24px}.reviewitem{padding:6px 8px}.voice-orb{width:42px;height:42px}.team-feedback .mini{min-height:66px}.qcard{padding:8px 11px;font-size:.95rem}}
@media(max-height:610px){.team-head .bodycopy{font-size:.88rem}.person p{display:none}.role-tag{font-size:.6rem}.reviewitem small{font-size:.64rem}.teacher-note{display:none}.qcard{font-size:.86rem;line-height:1.18}.team-feedback{display:none}}



/* v7 — Night Mode: atmosphere, accessibility and audio cues */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity 1.5s ease;background:
 radial-gradient(circle at 18% 22%,rgba(99,126,160,.14),transparent 28%),
 radial-gradient(circle at 82% 16%,rgba(217,184,108,.08),transparent 24%),
 linear-gradient(180deg,rgba(3,8,14,.05),rgba(1,4,8,.52));}
body.night-mode::before{opacity:1}
body.night-mode{--bg:#060a0f;--card:#10171b;--card2:#121b20;--line:#34444d;--muted:#b8c2c7;--gold:#e6c774;--gold2:#f1dda5;}
body.night-mode #app{background:radial-gradient(circle at 50% 22%,rgba(47,74,92,.16),transparent 36%),linear-gradient(180deg,#080e14,#05090d);}
body.night-mode .topbar{background:linear-gradient(180deg,#08131d,#071018);border-bottom-color:#2d414d;box-shadow:0 8px 30px rgba(0,0,0,.28)}
body.night-mode .brand{color:#f0d697;text-shadow:0 0 18px rgba(217,184,108,.16)}
body.night-mode .card{box-shadow:0 18px 60px rgba(0,0,0,.34)}
body.night-mode .art::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(136,180,206,.12),transparent 42%),linear-gradient(180deg,rgba(2,8,12,.10),rgba(2,6,10,.28));animation:nightBreath 6s ease-in-out infinite alternate}
body.night-mode .art img{filter:brightness(.56) saturate(.72) contrast(1.08)}
body.night-mode .voicepane{position:relative;background:linear-gradient(135deg,rgba(13,25,34,.92),rgba(8,15,21,.95));}
body.night-mode .voicepane::before{content:"";position:absolute;inset:8% 6%;pointer-events:none;border:1px solid rgba(217,184,108,.10);box-shadow:inset 0 0 55px rgba(73,130,164,.06);border-radius:18px;animation:voiceGlow 3.8s ease-in-out infinite}
body.night-mode .voicepane>*{position:relative;z-index:1}
body.night-mode .subtitle{text-shadow:0 2px 18px rgba(0,0,0,.65);letter-spacing:.005em}
body.night-mode .speaker{color:#f0cf7d}
body.night-mode .wave span{background:#e6c774;box-shadow:0 0 10px rgba(230,199,116,.42)}
body.night-mode .status .pill-night{display:inline-flex}
.pill-night{display:none;align-items:center;gap:6px;padding:4px 8px;border:1px solid rgba(230,199,116,.35);border-radius:999px;color:#f0d697;background:rgba(230,199,116,.06);font-size:.72rem;font-weight:800;letter-spacing:.05em}
.night-particles{position:fixed;inset:0;pointer-events:none;z-index:51;overflow:hidden;opacity:0;transition:opacity 1s ease}
body.night-mode .night-particles{opacity:.45}
.night-particles i{position:absolute;width:2px;height:2px;border-radius:50%;background:#d8e7ef;box-shadow:0 0 9px #a7d2e8;animation:drift var(--dur) linear infinite;opacity:var(--op)}
.night-toast{position:fixed;left:50%;bottom:72px;transform:translate(-50%,18px);z-index:80;max-width:min(760px,82vw);padding:10px 16px;border-radius:12px;background:rgba(6,12,17,.94);border:1px solid rgba(230,199,116,.35);color:#eee8da;font-size:clamp(.92rem,1.15vw,1.08rem);line-height:1.3;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;box-shadow:0 16px 44px rgba(0,0,0,.35)}
.night-toast.show{opacity:1;transform:translate(-50%,0)}
.audio-indicator{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.72rem}.audio-dot{width:7px;height:7px;border-radius:50%;background:#7f8a85}.audio-dot.on{background:#9fd7c4;box-shadow:0 0 10px rgba(159,215,196,.55)}
@keyframes nightBreath{from{opacity:.65}to{opacity:1}}
@keyframes voiceGlow{0%,100%{opacity:.55;transform:scale(.995)}50%{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:translate3d(0,105vh,0)}to{transform:translate3d(18px,-12vh,0)}}
@media(prefers-reduced-motion:reduce){body::before,.night-particles,.night-toast{transition:none}.night-particles i,.art::after,.voicepane::before{animation:none!important}}


/* =========================================================
   LARGE-DISTANCE TEXT OVERRIDES
   Optimized for classroom / projection viewing.
   Keeps the one-scene-per-screen layout.
   ========================================================= */
#app{grid-template-rows:48px minmax(0,1fr) 56px}
#stage{width:min(1440px,100%)}
.topbar{padding:0 20px}
.brand{font-size:clamp(.9rem,1.12vw,1.08rem)}
.status{font-size:clamp(1rem,1.24vw,1.16rem);gap:18px}

.kicker{font-size:clamp(.86rem,1.04vw,1rem)}
h1{font-size:clamp(3rem,6vw,5.7rem)}
.hero p{font-size:clamp(1.2rem,1.62vw,1.48rem);line-height:1.38;max-width:900px}
.startprompt{font-size:clamp(1.05rem,1.35vw,1.22rem);padding:11px 20px}

.content{padding:clamp(10px,1.8vh,18px) clamp(18px,2.4vw,30px)}
.eyebrow{font-size:clamp(.84rem,1vw,.96rem)}
h2{font-size:clamp(2.15rem,3.25vw,3.05rem);line-height:1.01}
.meta{font-size:clamp(.94rem,1.1vw,1.06rem);margin-bottom:clamp(6px,.9vh,9px)}
.bodycopy{font-size:clamp(1.12rem,1.45vw,1.32rem);line-height:1.31}

.options{gap:clamp(5px,.68vh,7px);margin-top:clamp(6px,.9vh,9px)}
.option{
  padding:clamp(7px,.72vh,9px) 12px;
  grid-template-columns:28px 1fr;
  gap:9px;
  font-size:clamp(1.08rem,1.38vw,1.27rem);
  line-height:1.18

  'Μια παλιά λέξη μπορεί να κουβαλά και παλιές προκαταλήψεις. Το ότι χρησιμοποιούνταν παλιότερα δεν σημαίνει ότι είναι ουδέτερη.',
  'Αν εξηγήσεις τον όρο, ο επισκέπτης μαθαίνει και για το αντικείμενο και για το πώς άλλαξαν τα μουσεία.',
  'Οι τοπικοί όροι δίνουν χώρο στη γλώσσα της κοινότητας προέλευσης. Χρειάζονται όμως σύντομη εξήγηση.'
 ],
 voiceGood:'Τα καρφιά πάνω μου δεν είναι θόρυβος ούτε διακόσμηση. Συνδέονταν με υποσχέσεις, διαμάχες και κοινωνικές δεσμεύσεις. Όταν με ονομάζεις, δεν περιγράφεις μόνο εμένα — περιγράφεις και τον τρόπο που το μουσείο έμαθε να κοιτάζει άλλους κόσμους.',
 voiceWeak:'Η λέξη που διάλεξες είναι μικρή, αλλά κουβαλά ιστορία. Αν την αφήσεις ανεξήγητη, ίσως ο επισκέπτης ακούσει περισσότερο το παλιό μουσείο παρά εμένα.'
},
{

  {t:'«Το Fuji που κρύβεται μπροστά στα μάτια μας»',d:'Κάνει τον επισκέπτη να ξανακοιτάξει κάτι που νόμιζε ότι ήδη γνώριζε.',score:{doc:7,acc:7,coh:5},quality:2},
  {t:'«Μια ιαπωνική εικόνα με παγκόσμιο μπλε»',d:'Συνδέει την τεχνική με το ταξίδι υλικών και ιδεών.',score:{doc:6,plu:7,coh:4},quality:2}

 ],

// v7 audio / atmosphere layer. No external sound files are required.
let audioCtx=null;
let masterGain=null;
let audioUnlocked=false;
const voiceProfiles={
 hatshepsut:{rate:.82,pitch:.82}, amphora:{rate:.94,pitch:1.03}, astrolabe:{rate:.86,pitch:.90},
 reliquary:{rate:.80,pitch:.84}, mangaaka:{rate:.78,pitch:.76}, wave:{rate:.88,pitch:1.08}
};
function unlockAudio(){
 try{
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=.17;masterGain.connect(audioCtx.destination)}
  if(audioCtx.state==='suspended')audioCtx.resume();audioUnlocked=true;
 }catch(e){audioUnlocked=false}
}
function tone(freq,dur=.35,when=0,type='sine',vol=.09){
 if(!audioUnlocked||!audioCtx||!masterGain)return;
 const t=audioCtx.currentTime+when,o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.05)
}
function playClosingCue(){unlockAudio();tone(196,.8,0,'sine',.07);tone(293.7,.9,.22,'sine',.05);tone(440,.9,.48,'sine',.035)}
function playAwakenCue(id,good){unlockAudio();const map={hatshepsut:174.6,amphora:220,astrolabe:261.6,reliquary:196,mangaaka:146.8,wave:329.6};const f=map[id]||220;if(good){tone(f,.48,0,'sine',.07);tone(f*1.5,.58,.14,'triangle',.045);tone(f*2,.68,.32,'sine',.025)}else{tone(f*.75,.42,0,'triangle',.045);tone(f,.46,.22,'sine',.026)}}
function showNightToast(text){const el=document.getElementById('nightToast');if(!el)return;el.textContent=text;el.classList.add('show');clearTimeout(showNightToast.t);showNightToast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function setNightMode(on){document.body.classList.toggle('night-mode',!!on)}
function buildParticles(){const box=document.getElementById('nightParticles');if(!box||box.children.length)return;for(let i=0;i<24;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.top=(-10-Math.random()*100)+'vh';p.style.setProperty('--dur',(12+Math.random()*18)+'s');p.style.setProperty('--op',(.18+Math.random()*.55).toFixed(2));p.style.animationDelay=(-Math.random()*22)+'s';box.appendChild(p)}}
buildParticles();

function renderStart(){setLabels('Εισαγωγή');stage.innerHTML=`<section class="card hero"><div><div class="kicker">Αφηγηματικό παιχνίδι · γίνε επιμελητής</div><h1>Όταν κλείνουν<br>οι αίθουσες</h1><p>Αύριο ανοίγει η πρώτη έκθεση που έχεις αναλάβει. Σήμερα πρέπει να εξετάσεις τα αντικείμενα, να αποφασίσεις πώς θα παρουσιαστούν και να ολοκληρώσεις τις λεζάντες. Όταν σβήσουν τα φώτα, ίσως ακούσεις τι έχουν να σου πουν τα ίδια τα εκθέματα.</p><div class="startprompt">A / ENTER — ΕΝΑΡΞΗ</div></div></section>`}
function renderBriefing(){setLabels('Η ομάδα');stage.innerHTML=`<section class="card team-screen"><div class="team-head"><div><div class="kicker">09:10 · Αίθουσα συσκέψεων</div><h2>Έχεις μια ομάδα δίπλα σου.</h2><div class="bodycopy">Τέσσερις συνεργάτες θα σου δίνουν συμβουλές από διαφορετική σκοπιά. <strong>Μπορεί να μη συμφωνούν πάντα.</strong> Πάτησε Y όταν θέλεις να δεις τι σκέφτεται ο κατάλληλος συνεργάτης.</div></div><div class="bodycopy">Η έκθεση ανοίγει αύριο στις 10:00. Στις 20:00 το μουσείο κλείνει. <strong>Επιμέλεια</strong> σημαίνει ότι επιλέγεις τι θα δείξεις, πώς θα το οργανώσεις και τι θα εξηγήσεις στον επισκέπτη.</div></div><div class="teamgrid">${Object.entries(people).map(([k,p])=>`<div class="person"><div class="person-art">${portraitIMG(k)}</div><div><div class="role-tag">${p.tag}</div><h3>${p.name}</h3><p>${p.role}</p></div></div>`).join('')}</div><div class="options"><button class="option" data-continue="strategy"><span class="num">→</span><span><strong>Πάμε στην αίθουσα</strong><small>Πρώτα διαλέγεις πώς θα οργανώσεις την έκθεση.</small></span></button></div></section>`;bindOptions()}
function renderStrategy(){setLabels('Σχεδιασμός έκθεσης');stage.innerHTML=`<section class="card strategy"><div><div class="kicker">09:25 · Πριν ανοίξουν οι αίθουσες</div><h2>Ποια λογική θα οργανώσει την έκθεση;</h2><p class="manifesto">Δεν υπάρχει ουδέτερη σειρά. Η θέση ενός αντικειμένου επηρεάζει τι θεωρεί ο επισκέπτης σημαντικό και με τι το συγκρίνει.</p><div class="advisor">${portraitInline('Άννα')}<span><strong>Άννα</strong> · «Διάλεξε μια αρχή που θα μπορείς να υπερασπιστείς και στα έξι αντικείμενα.»</span></div></div><div class="options"><button class="option" data-choice="chron"><span class="num">1</span><span><strong>Χρονολογική</strong><small>Από το αρχαιότερο προς το νεότερο. Καθαρή χρονική γραμμή.</small></span></button><button class="option" data-choice="theme"><span class="num">2</span><span><strong>Θεματική</strong><small>Εξουσία · τελετουργία · γνώση · κοινωνία · κυκλοφορία.</small></span></button><button class="option" data-choice="reading"><span class="num">3</span><span><strong>«Πώς διαβάζουμε ένα αντικείμενο»</strong><small>Μορφή · υλικό · λειτουργία · πλαίσιο · ερμηνεία.</small></span></button></div></section>`;bindOptions()}
function ex(){return exhibits[state.idx]}
function obsFor(e){if(!state.observed[e.id])state.observed[e.id]=[false,false,false];return state.observed[e.id]}
function obsArr(){return obsFor(ex())}
function assetStemFor(e){
  if(e.id==='wave') return 'wave';
  return e.id;
}
function imageCandidatesFor(e){
  const stem=assetStemFor(e);
  const names=[stem];
  if(e.id==='wave') names.push('great_wave');
  const exts=['jpg','jpeg','png','webp'];
  return names.flatMap(n=>exts.map(ext=>`assets/exhibits/${n}.${ext}`));
}
window.nextLocalImage=function(img){
  let list=[];
  try{ list=JSON.parse(img.dataset.candidates||'[]') }catch(_){}
  let i=Number(img.dataset.candidateIndex||0)+1;
  if(i<list.length){
    img.dataset.candidateIndex=String(i);
    img.src=list[i];
    return;
  }
  img.onerror=null;
  img.style.opacity=.14;
  const parent=img.parentElement;
  if(parent && !parent.querySelector('.asset-warning')){
    const box=document.createElement('div');
    box.className='asset-warning';
    box.style.cssText='position:absolute;inset:32% 8%;text-align:center;color:#f0e7d5;background:#111d;padding:16px;border:1px solid #8b7654;border-radius:10px;font-size:clamp(.9rem,1.1vw,1.05rem);line-height:1.35';
    box.innerHTML='<strong>Δεν βρέθηκε η εικόνα.</strong><br>Έλεγξε τον φάκελο <code>assets/exhibits</code> και το όνομα του αρχείου.';
    parent.appendChild(box);
  }
};
function artHTML(e,night=false){
  const candidates=imageCandidatesFor(e);
  const safe=JSON.stringify(candidates).replace(/"/g,'&quot;');
  return `<div class="art ${night?'night':''}"><img src="${candidates[0]}" data-candidates="${safe}" data-candidate-index="0" alt="${e.title}" onerror="nextLocalImage(this)"><div class="artcredit">${e.credit}</div></div>`;
}
function renderObserve(){const e=ex(),obs=obsArr();setLabels('Ημέρα · Παρατήρηση',`${state.idx+1}/6 · ${e.short}`);stage.innerHTML=`<section class="card scene">${artHTML(e)}<div class="content"><div class="eyebrow">${String(10+state.idx).padStart(2,'0')}:${state.idx%2?'35':'10'} · Έκθεμα ${state.idx+1} από 6</div><h2>${e.title}</h2><div class="meta">${e.meta}</div><div class="progressline"><span style="width:${((state.idx)/6)*100}%"></span></div><div class="bodycopy">${e.intro}</div><div class="options">${e.evidence.map((x,i)=>`<button class="option ${obs[i]?'done':''}" data-obs="${i}"><span class="num">${i+1}</span><span><strong>${x[0]}</strong><small>${obs[i]?'Εξετάστηκε':'A — Εξέταση'}</small></span></button>`).join('')}<button class="option" data-next="decision"><span class="num">→</span><span><strong>Πήγαινε στην επιμελητική απόφαση</strong><small>Μπορείς να συνεχίσεις και χωρίς όλα τα στοιχεία.</small></span></button></div><div id="obsNote" class="note hidden"></div><div class="badges">${obs.map((v,i)=>`<span class="badge ${v?'on':''}">Στοιχείο ${i+1}</span>`).join('')}</div></div></section>`;bindOptions()}
function renderDecision(){const e=ex();setLabels('Ημέρα · Επιμέλεια',`${state.idx+1}/6 · ${e.short}`);stage.innerHTML=`<section class="card scene">${artHTML(e)}<div class="content"><div class="eyebrow">Απόφαση για την παρουσίαση</div><h2>${e.question}</h2><div class="meta">${e.title}</div><div class="bodycopy">Με το <strong>Y</strong> βλέπεις τι μπορεί να κερδίσεις ή να χάσεις με κάθε επιλογή. Η βοήθεια δεν αφαιρεί πόντους.</div><div class="options">${e.choices.map((c,i)=>`<button class="option" data-decision="${i}"><span class="num">${i+1}</span><span><strong>${c.t}</strong><small>${c.d}</small></span></button>`).join('')}</div><div class="advisor">${portraitInline(e.advisor[0])}<span><strong>${e.advisor[0]}</strong> · ${e.advisor[2]} · Y για επιμελητική σκέψη</span></div></div></section>`;bindOptions()}
function qualityFor(e){const obs=obsFor(e).filter(Boolean).length;const ci=state.choices[e.id];if(ci==null)return false;return obs>=2 && e.choices[ci].quality>=2}
function renderClosing(){setLabels('Το μουσείο κλείνει','20:07');stage.innerHTML=`<section class="card interlude"><div class="nightmark"></div><div style="position:relative;z-index:2"><div class="kicker">20:07 · Οι τελευταίοι επισκέπτες έφυγαν</div><h2>Το μουσείο βυθίζεται σιγά σιγά στη σιωπή.</h2><div class="bodycopy">Οι πόρτες έκλεισαν. Τα βήματα έσβησαν. Μόνο τα φώτα ασφαλείας μένουν αναμμένα και οι αίθουσες μοιάζουν διαφορετικές τώρα που δεν υπάρχει κοινό.</div><blockquote>«Αύριο θα μιλήσουν οι επισκέπτες. Απόψε, ίσως μιλήσουν πρώτα τα ίδια τα αντικείμενα.»<br><small>— σημείωμα της Άννας</small></blockquote><div class="note" style="margin-top:14px">Πάτησε <strong>A</strong> όταν είσαι έτοιμος. Από εδώ και πέρα αρχίζει η νυχτερινή διαδρομή.</div></div><div style="position:relative;z-index:2;text-align:right"><div class="clock">20:07</div><div class="options"><button class="option" data-continue="threshold"><span class="num">→</span><span><strong>Σβήσε τα φώτα της ημέρας</strong><small>Κάνε τον τελευταίο γύρο στις άδειες αίθουσες.</small></span></button></div></div></section>`;bindOptions();playClosingCue();showNightToast('Το μουσείο έκλεισε. Κάτι αλλάζει στις αίθουσες.') }
function renderThreshold(){setLabels('Νύχτα · Πριν από την πρώτη φωνή','20:11');stage.innerHTML=`<section class="card interlude"><div class="nightmark"></div><div style="position:relative;z-index:2"><div class="kicker">20:11 · Πρώτη αίθουσα</div><h2>Στέκεσαι μόνος μπροστά στην πρώτη προθήκη.</h2><div class="bodycopy">Ο αέρας ακούγεται αλλιώς. Μια ανεπαίσθητη δόνηση περνά από την αίθουσα και για μια στιγμή έχεις την αίσθηση ότι κάποιος σε παρατηρεί.</div><blockquote>Δεν ακούγεται από το διάδρομο.<br>Ακούγεται από μέσα στην έκθεση.</blockquote><div class="note" style="margin-top:14px">Σε λίγο θα αρχίσεις να ακούς τα εκθέματα ένα ένα. Οι υπότιτλοι μένουν πάντα ανοιχτοί. Με <strong>X</strong> επαναλαμβάνεις μια φωνή.</div></div><div style="position:relative;z-index:2;text-align:right"><div class="clock">20:11</div><div class="options"><button class="option" data-continue="night"><span class="num">→</span><span><strong>Ακολούθησε την πρώτη φωνή</strong><small>Η νυχτερινή διαδρομή αρχίζει τώρα.</small></span></button></div></div></section>`;bindOptions();showNightToast('Από την πρώτη αίθουσα ακούγεται ένας ψίθυρος.')}
function renderNight(){const e=exhibits[state.nightIdx],good=qualityFor(e),text=good?e.voiceGood:e.voiceWeak;if(good&&!state['voice_'+e.id]){state['voice_'+e.id]=true;state.voices++}state.lastVoice=text;setLabels('Νύχτα · Οι φωνές',`${state.nightIdx+1}/6 · ${e.short}`);stage.innerHTML=`<section class="card dialogue"><div>${artHTML(e,true)}</div><div class="voicepane" id="voicepane"><div class="speaker">${state.nightIdx===0?'Η πρώτη φωνή':' '}${state.nightIdx===0?' · ':''}${good?'Η φωνή του εκθέματος':'Ψίθυρος'}</div><div class="wave"><span></span><span></span><span></span><span></span><span></span></div><div class="subtitle">${text}</div><div class="voicehint">${state.nightIdx===0?'Η σιωπή έσπασε. Άκου προσεκτικά τι αλλάζει όταν ένα αντικείμενο αποκτά φωνή.<br>':''}${good?'Η επιλογή σου βοήθησε να ακουστεί πιο καθαρά η ιστορία του εκθέματος.':'Κάποια στοιχεία δεν πρόλαβες να τα εξετάσεις ή να τα συνδέσεις.'}<br><strong>X</strong> — επανάληψη · <strong>A</strong> — ${state.nightIdx===exhibits.length-1?'δες την έκθεση που δημιούργησες':'επόμενη αίθουσα'}.</div></div></section>`;playAwakenCue(e.id,good);speak(text,e.id,good?'good':'weak')}
function decisionLabel(e){const i=state.choices[e.id];return i==null?'Δεν ολοκληρώθηκε':e.choices[i].t}
function renderReview(){setLabels('Η έκθεσή σου','Ανασκόπηση');stage.innerHTML=`<section class="card exhibit-review"><div class="reviewhead"><div><div class="kicker">08:35 · Λίγο πριν τα εγκαίνια</div><h2>Η έκθεση που δημιούργησες</h2></div><div class="bodycopy"><strong>${strategyName(state.strategy)}</strong><br>${state.voices}/6 αντικείμενα μίλησαν με πλήρη φωνή.</div></div><div class="reviewgrid">${exhibits.map((e,i)=>{const full=!!state['voice_'+e.id];return `<div class="reviewitem"><div class="voice-orb ${full?'full':''}">${full?'●':'·'}</div><div><strong>${i+1}. ${e.short}</strong><small class="decision">${decisionLabel(e)}</small><small>${full?'Καθαρή φωνή':'Ψίθυρος'} · ${obsFor(e).filter(Boolean).length}/3 στοιχεία</small></div></div>`}).join('')}</div><div class="options"><button class="option" data-continue="score"><span class="num">→</span><span><strong>Δες την αξιολόγηση</strong><small>Οι τέσσερις δείκτες περιγράφουν τα μοτίβα των επιλογών σου.</small></span></button></div></section>`;bindOptions()}
function renderScore(){setLabels('Αξιολόγηση','6/6');const s=Object.fromEntries(Object.entries(state.score).map(([k,v])=>[k,clamp(v)]));const total=Math.round((s.doc+s.acc+s.plu+s.coh)/4);let profile='Ο τεκμηριωμένος αφηγητής',desc='Συνδέεις την έρευνα με μια σαφή αφήγηση.';const max=Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];if(max==='acc'){profile='Ο επιμελητής της εμπειρίας';desc='Δίνεις ιδιαίτερο βάρος στο τι θα καταλάβει ο μη ειδικός επισκέπτης.'}if(max==='plu'){profile='Ο επιμελητής των πολλών οπτικών';desc='Προσέχεις πώς η γλώσσα επηρεάζει την ιστορία και δίνεις χώρο σε περισσότερες από μία οπτικές.'}if(max==='coh'){profile='Ο επιμελητής της αφήγησης';desc='Βλέπεις την έκθεση ως ενιαία ιστορία και όχι ως σειρά ανεξάρτητων αντικειμένων.'}
const feedback=[['Άννα',s.doc>=75?'Οι περισσότερες αποφάσεις σου πατούν σε τεκμήρια.':'Σε αρκετά σημεία η ερμηνεία προηγήθηκε των τεκμηρίων.'],['Μάρκος',s.acc>=75?'Έκανες την ιστορία εύκολη να την ακολουθήσει κάποιος χωρίς ειδικές γνώσεις.':'Σε μερικά σημεία ο επισκέπτης χρειάζεται περισσότερη εξήγηση.'],['Ναΐμα',s.plu>=75?'Έδειξες ότι οι λέξεις που διαλέγει ένα μουσείο έχουν σημασία.':'Μερικές λεζάντες παρουσιάζουν κυρίως μία μόνο οπτική.'],['Πέτρος',s.coh>=75?'Η έκθεση μοιάζει με μία ενιαία ιστορία.':'Μερικές καλές επιλογές δεν συνδέονται αρκετά μεταξύ τους.']];
stage.innerHTML=`<section class="card score"><div class="scoretop"><div><div class="totalscore">${total}<small>/100</small></div><div class="code">T${s.doc}-A${s.acc}-P${s.plu}-C${s.coh}</div></div><div><div class="kicker">Η έκθεση άνοιξε</div><h2>${profile}</h2><div class="bodycopy">${desc}</div></div></div><div class="scoregrid"><div class="scorecard"><strong>${s.doc}</strong><span>Τεκμηρίωση</span></div><div class="scorecard"><strong>${s.acc}</strong><span>Κατανόηση</span></div><div class="scorecard"><strong>${s.plu}</strong><span>Πολλές οπτικές</span></div><div class="scorecard"><strong>${s.coh}</strong><span>Συνοχή</span></div></div><div class="panel"><h3>Η ομάδα σχολιάζει</h3><div class="team-feedback">${feedback.map(x=>`<div class="mini"><strong>${x[0]}</strong>${x[1]}</div>`).join('')}</div><p style="margin-top:7px">Καθαρή φωνή: <strong>${state.voices}/6</strong> · Στοιχεία: <strong>${state.evidence}/18</strong> · Hints: <strong>${state.hints}</strong> · Οργάνωση: <strong>${strategyName(state.strategy)}</strong></p></div><div class="options" style="grid-template-columns:1.15fr 1fr 1fr;margin-top:8px"><button class="option" data-continue="debrief"><span class="num">?</span><span><strong>Ερωτήσεις συζήτησης</strong><small>Για τάξη ή σεμινάριο.</small></span></button><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong><small>Άλλη στρατηγική.</small></span></button><button class="option" data-credits="1"><span class="num">i</span><span><strong>Πηγές</strong><small>Έργα και άδειες.</small></span></button></div></section>`;bindOptions()}
function renderDebrief(){setLabels('Αναστοχασμός','Συζήτηση');stage.innerHTML=`<section class="card debrief"><div><div class="kicker">Μετά το παιχνίδι</div><h2>Τρεις ερωτήσεις για συζήτηση</h2><div class="bodycopy">Σύγκρινε τις επιλογές σου με έναν συμμαθητή ή φίλο. Το ενδιαφέρον είναι να εξηγήσετε <strong>γιατί</strong> φτιάξατε διαφορετικές εκθέσεις.</div><div class="teacher-note">Για τον εκπαιδευτικό: 10–15 λεπτά συζήτησης αρκούν για να συνδεθεί το παιχνίδι με την επιλογή πληροφοριών, την τεκμηρίωση και τον τρόπο που παρουσιάζουμε διαφορετικούς πολιτισμούς.</div></div><div class="qstack"><div class="qcard">1. Μπορεί μια λεζάντα να έχει σωστά στοιχεία αλλά να δίνει παρ’ όλα αυτά λάθος εντύπωση;</div><div class="qcard">2. Πότε η απλοποίηση βοηθά τον επισκέπτη και πότε αφήνει έξω κάτι σημαντικό;</div><div class="qcard">3. Ποιος πρέπει να έχει λόγο στο πώς παρουσιάζεται ένα αντικείμενο: οι ειδικοί, το μουσείο, η κοινότητα από την οποία προέρχεται ή οι επισκέπτες;</div><div class="options" style="grid-template-columns:1fr 1fr"><button class="option" data-restart="1"><span class="num">↻</span><span><strong>Παίξε ξανά</strong></span></button><button class="option" data-credits="1"><span class="num">i</span><span><strong>Πηγές και άδειες</strong></span></button></div></div></section>`;bindOptions()}
function strategyName(v){return v==='chron'?'Χρονολογική':v==='theme'?'Θεματική':'Πώς διαβάζουμε ένα αντικείμενο'}
function activate(){unlockAudio();if(modal.classList.contains('open')){closeModal();return}if(state.mode==='start'){state.mode='briefing';render();return}if(state.mode==='night'){if(state.nightIdx<exhibits.length-1){state.nightIdx++;render()}else{state.mode='review';render()}return}const a=options(),el=a[state.focus];if(!el)return;if(el.dataset.continue){state.mode=el.dataset.continue;if(state.mode==='night')state.nightIdx=0;render();return}if(el.dataset.choice){state.strategy=el.dataset.choice;if(state.strategy==='chron')state.score.coh+=5;else if(state.strategy==='theme'){state.score.coh+=7;state.score.plu+=2}else{state.score.doc+=3;state.score.acc+=4;state.score.coh+=5}state.idx=0;state.mode='observe';render();return}if(el.dataset.obs!=null){const i=+el.dataset.obs,arr=obsArr();if(!arr[i]){arr[i]=true;state.evidence++;state.score.doc+=1;document.getElementById('evidenceLabel').textContent=state.evidence+'/18'}const n=document.getElementById('obsNote');n.textContent=ex().evidence[i][1];n.classList.remove('hidden');el.classList.add('done');const badges=stage.querySelectorAll('.badge');if(badges[i])badges[i].classList.add('on');return}if(el.dataset.next){state.mode='decision';render();return}if(el.dataset.decision!=null){const i=+el.dataset.decision,e=ex();state.choices[e.id]=i;Object.entries(e.choices[i].score).forEach(([k,v])=>state.score[k]+=v);if(state.idx<exhibits.length-1){state.idx++;state.mode='observe'}else state.mode='closing';render();return}if(el.dataset.restart){location.reload();return}if(el.dataset.credits){showCredits();return}}
function move(d){if(modal.classList.contains('open'))return;const a=options();if(!a.length)return;state.focus=(state.focus+d+a.length)%a.length;updateFocus()}
function showHint(){if(modal.classList.contains('open'))return;if(state.mode==='strategy'){state.hints++;showModal('Άννα — Επιμελητική σκέψη',portraitIMG('anna'),'<p><strong>Χρονολογική:</strong> δείχνει καθαρά τι έγινε πριν και τι μετά. Μπορεί όμως να δώσει την εντύπωση ότι όλοι οι πολιτισμοί ακολουθούν την ίδια πορεία.</p><p><strong>Θεματική:</strong> βοηθά να συγκρίνεις αντικείμενα από διαφορετικές εποχές. Χρειάζεται όμως να μη χαθούν οι διαφορές τους.</p><p><strong>Πώς διαβάζουμε ένα αντικείμενο:</strong> βοηθά τον επισκέπτη να μάθει έναν τρόπο παρατήρησης. Πρέπει όμως να χρησιμοποιείς αυτή τη λογική σε όλη την έκθεση.</p>');return}if(state.mode==='decision'){state.hints++;const e=ex(),key=personKey(e.advisor[0]);showModal(`${e.advisor[0]} — Επιμελητική σκέψη`,portraitIMG(key),`<p>${e.hints[state.focus]||e.hints[0]}</p><p><strong>Το hint δεν αφαιρεί πόντους.</strong> Δείχνει τι μπορεί να κερδίσεις ή να χάσεις. Δεν υπάρχει πάντα μία σωστή λύση.</p>`)} }
function showModal(title,portrait,html){document.getElementById('modalTitle').textContent=title;const av=document.getElementById('modalAvatar');if(String(portrait).includes('<svg')){av.innerHTML=portrait;av.style.overflow='hidden'}else av.textContent=portrait;document.getElementById('modalBody').innerHTML=html;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
function showCredits(){showModal('Πηγές και άδειες','i',`<p>Τα ιστορικά στοιχεία προέρχονται από τις καταγραφές του <strong>Metropolitan Museum of Art</strong> για τα έξι αντικείμενα.</p><p>Το παιχνίδι χρησιμοποιεί <strong>μόνο τοπικά αρχεία</strong> από τον φάκελο <code>assets</code>. Δεν απαιτεί Internet για εικόνες ή φωνές. Οι εικόνες πρέπει να βρίσκονται στο <code>assets/exhibits</code> και οι ηχογραφήσεις στο <code>assets/audio</code>.</p><p>Οι τέσσερις συνεργάτες του μουσείου και οι «φωνές» των εκθεμάτων είναι <strong>φανταστικοί χαρακτήρες</strong>. Τα πορτρέτα της ομάδας είναι ενσωματωμένα στο ίδιο το HTML.</p>`) }
function audioCandidates(exhibitId,variant){
  const exts=['mp3','wav','m4a','ogg'];
  const stems=[];
  if(variant) stems.push(`${exhibitId}_${variant}`);
  stems.push(exhibitId);
  return stems.flatMap(s=>exts.map(ext=>`assets/audio/${s}.${ext}`));
}
function playLocalAudioCandidates(candidates,index,text,exhibitId,p){
  if(index>=candidates.length){
    speakTTS(text,exhibitId,p);
    return;
  }
  const a=new Audio(candidates[index]);
  a.preload='auto';
  let settled=false;
  const tryNext=()=>{
    if(settled)return;
    settled=true;
    if(activeVoiceAudio===a)activeVoiceAudio=null;
    playLocalAudioCandidates(candidates,index+1,text,exhibitId,p);
  };
  a.oncanplaythrough=()=>{
    if(settled)return;
    settled=true;
    activeVoiceAudio=a;
    a.play().catch(()=>playLocalAudioCandidates(candidates,index+1,text,exhibitId,p));
  };
  a.onended=()=>{
    if(p)p.classList.remove('speaking');
    if(activeVoiceAudio===a)activeVoiceAudio=null;
  };
  a.onerror=tryNext;
  a.load();
}
function speak(text,exhibitId=null,variant=null){
  state.lastVoice=text;
  state.lastVoiceId=exhibitId;
  state.lastVoiceVariant=variant;
  unlockAudio();
  if(activeVoiceAudio){activeVoiceAudio.pause();activeVoiceAudio=null}
  speechSynthesis.cancel();
  const p=document.getElementById('voicepane');
  if(p)p.classList.add('speaking');
  if(exhibitId){
    playLocalAudioCandidates(audioCandidates(exhibitId,variant),0,text,exhibitId,p);
    return;
  }
  speakTTS(text,exhibitId,p);
}
function speakTTS(text,exhibitId,p){if(!('speechSynthesis'in window)){if(p)p.classList.remove('speaking');return}const u=new SpeechSynthesisUtterance(text);u.lang='el-GR';const prof=voiceProfiles[exhibitId]||{rate:.88,pitch:.94};u.rate=prof.rate;u.pitch=prof.pitch;u.volume=1;const voices=speechSynthesis.getVoices();const greek=voices.filter(v=>/^el/i.test(v.lang)||/Greek/i.test(v.name));if(greek.length){const order=['hatshepsut','reliquary','mangaaka'].includes(exhibitId)?0:Math.min(1,greek.length-1);u.voice=greek[order]}u.onstart=()=>{if(p)p.classList.add('speaking')};u.onend=()=>p&&p.classList.remove('speaking');u.onerror=()=>p&&p.classList.remove('speaking');speechSynthesis.speak(u)}
function back(){if(modal.classList.contains('open')){closeModal();return}if(state.mode==='briefing'){state.mode='start';render()}else if(state.mode==='strategy'){state.mode='briefing';render()}else if(state.mode==='decision'){state.mode='observe';render()}else if(state.mode==='observe'&&state.idx===0){state.mode='strategy';render()}else if(state.mode==='threshold'){state.mode='closing';render()}else if(state.mode==='review'){state.mode='night';state.nightIdx=5;render()}else if(state.mode==='debrief'){state.mode='score';render()}}
window.addEventListener('keydown',e=>{unlockAudio();if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}else if(e.key.toLowerCase()==='y'){showHint()}else if(e.key.toLowerCase()==='x'&&state.lastVoice){const id=state.mode==='night'?exhibits[state.nightIdx].id:null;speak(state.lastVoice,id,state.mode==='night'?state.lastVoiceVariant:null)}else if(e.key==='Escape'||e.key.toLowerCase()==='b'){back()}});
document.getElementById('modalClose').onclick=closeModal;
let prev=[];function gpLoop(){const pads=navigator.getGamepads?navigator.getGamepads():[];const g=pads[0];document.getElementById('padStatus').textContent=g?'🎮 Χειριστήριο':'⌨ Πληκτρολόγιο';document.getElementById('padStatus').className=g?'controller-ok':'';if(g){const now=g.buttons.map(b=>b.pressed);const edge=i=>now[i]&&!prev[i];const yAxis=g.axes[1]||0,xAxis=g.axes[0]||0;const up=edge(12)||(yAxis<-.65&&!prev._up);const down=edge(13)||(yAxis>.65&&!prev._down);const left=edge(14)||(xAxis<-.65&&!prev._left);const right=edge(15)||(xAxis>.65&&!prev._right);if(down||right)move(1);if(up||left)move(-1);if(edge(0))activate();if(edge(1))back();if(edge(2)&&state.lastVoice)speak(state.lastVoice,state.mode==='night'?exhibits[state.nightIdx].id:null,state.mode==='night'?state.lastVoiceVariant:null);if(edge(3))showHint();prev=now;prev._up=yAxis<-.65;prev._down=yAxis>.65;prev._left=xAxis<-.65;prev._right=xAxis>.65}else prev=[];requestAnimationFrame(gpLoop)}
render();requestAnimationFrame(gpLoop);
})();
