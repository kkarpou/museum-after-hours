<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e0d"><title>Όταν κλείνουν οι αίθουσες</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a09;font-family:"Segoe UI",Tahoma,Arial,system-ui,-apple-system,sans-serif}#game{width:100%;height:100%;border:0;display:block;background:#080a09}.qr-card{position:fixed;right:28px;bottom:72px;z-index:1000;width:190px;padding:12px;background:rgba(13,17,16,.96);border:1px solid #6e6244;box-shadow:0 16px 50px rgba(0,0,0,.45);color:#f2efe7;text-align:center}.qr-card img{display:block;width:156px;height:156px;margin:0 auto 8px;background:#fff;padding:5px}.qr-card strong{display:block;color:#f2d99c;font-size:.88rem}.qr-card span{display:block;margin-top:3px;color:#aaa99f;font-size:.72rem;line-height:1.25}.qr-card.hidden{display:none}@media(max-width:850px){.qr-card{display:none!important}}</style></head><body><iframe id="game" src="museum-core.html?v=2" title="Όταν κλείνουν οι αίθουσες" allow="autoplay; fullscreen"></iframe><div class="qr-card hidden" id="mobileQR"><img src="assets/qr/museum-mobile.png" alt="QR για mobile έκδοση"><strong>ΠΑΙΞΕ ΣΤΟ ΚΙΝΗΤΟ</strong><span>Σκάναρε για την έκδοση αφής</span></div><script>const frame=document.getElementById('game'),qr=document.getElementById('mobileQR');let STRINGS={};fetch('museum/i18n/strings-el.json?v=2',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{STRINGS=(j&&j.strings)||{};try{localize(frame.contentDocument.body)}catch(e){}}).catch(()=>{});function localize(root){if(!root)return;const d=root.ownerDocument||document,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){const p=n.parentElement;if(!p||p.closest('script,style'))continue;const s=n.nodeValue,trim=s.trim();if(Object.prototype.hasOwnProperty.call(STRINGS,trim)&&STRINGS[trim]!==trim){const a=s.match(/^\s*/)?.[0]||'',b=s.match(/\s*$/)?.[0]||'';n.nodeValue=a+STRINGS[trim]+b}}}function syncStart(d){const stage=d.getElementById('stage');if(stage)qr.classList.toggle('hidden',!stage.querySelector('.hero'))}frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const st=d.createElement('style');st.id='greek-font-layer';st.textContent=`html,body,#app,button,input,select,textarea,h1,h2,h3,.hero p,.bodycopy,.subtitle,.manifesto,.totalscore,.scorecard strong,.modalbox h3,.person h3,.interlude blockquote{font-family:"Segoe UI",Tahoma,Arial,system-ui,-apple-system,sans-serif!important}h1,h2,h3,.person h3,.modalbox h3{font-weight:650!important}`;d.head.appendChild(st);localize(d.body);syncStart(d);const stage=d.getElementById('stage');if(stage)new MutationObserver(muts=>{for(const m of muts)for(const n of m.addedNodes)if(n.nodeType===1)localize(n);syncStart(d)}).observe(stage,{childList:true,subtree:true})}catch(e){console.error(e)}});</script></body></html>
