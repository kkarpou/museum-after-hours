<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0e0d"><title>Όταν κλείνουν οι αίθουσες — Mobile</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a09;font-family:"Segoe UI",Tahoma,Arial,system-ui,-apple-system,sans-serif}#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 70px}#game{width:100%;height:100%;border:0;background:#080a09}#touchbar{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#343a36;padding:1px 1px calc(1px + env(safe-area-inset-bottom))}.touch{border:0;background:#121614;color:#e8e5dc;min-height:58px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}.touch.primary{background:#443b24;color:#f2d98f}.icon{font-size:1.3rem;font-weight:800}.label{font-size:.62rem;white-space:nowrap}@media(orientation:landscape) and (max-height:600px){#shell{grid-template-rows:minmax(0,1fr) 54px}.touch{min-height:46px;flex-direction:row}.icon{font-size:1rem}}</style></head><body><div id="shell"><iframe id="game" src="museum-core.html?v=2" title="Όταν κλείνουν οι αίθουσες" allow="autoplay; fullscreen"></iframe><nav id="touchbar"><button class="touch" data-key="Escape"><span class="icon">←</span><span class="label">Πίσω</span></button><button class="touch" data-key="ArrowUp"><span class="icon">↑</span><span class="label">Πάνω</span></button><button class="touch primary" data-key="Enter"><span class="icon">●</span><span class="label">Επιλογή</span></button><button class="touch" data-key="ArrowDown"><span class="icon">↓</span><span class="label">Κάτω</span></button><button class="touch" data-key="y"><span class="icon">?</span><span class="label">Βοήθεια</span></button><button class="touch" data-key="x"><span class="icon">↻</span><span class="label">Φωνή</span></button></nav></div><script>const frame=document.getElementById('game');function sendKey(key){try{frame.contentWindow.focus();frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}catch(e){}}document.querySelectorAll('.touch').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();sendKey(b.dataset.key)}));frame.addEventListener('load',()=>{try{const d=frame.contentDocument,s=d.createElement('style');s.textContent=`html{height:100%!important;overflow:hidden!important}body{height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important;font-family:"Segoe UI",Tahoma,Arial,system-ui,-apple-system,sans-serif!important}#app{height:auto!important;min-height:100%!important;display:block!important;overflow:visible!important}.topbar{position:sticky!important;top:0!important;z-index:30!important;min-height:42px!important;padding:0 10px!important}.status,.controls{display:none!important}main{display:block!important;height:auto!important;min-height:calc(100dvh - 42px)!important;overflow:visible!important;padding:7px!important}#stage,.card{height:auto!important;min-height:calc(100dvh - 54px)!important;overflow:visible!important}.scene,.dialogue,.strategy,.interlude{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important}.art{height:36dvh!important;min-height:230px!important;border-right:0!important;border-bottom:1px solid var(--line)!important}.content,.voicepane{height:auto!important;overflow:visible!important;padding:16px 14px 28px!important}.hero{min-height:calc(100dvh - 54px)!important;padding:24px 15px!important}h1,h2,h3,.hero p,.bodycopy,.subtitle,.manifesto,.totalscore,.scorecard strong,.modalbox h3,.person h3{font-family:"Segoe UI",Tahoma,Arial,system-ui,-apple-system,sans-serif!important}.hero h1{font-size:clamp(2.7rem,14vw,4.6rem)!important}.bodycopy{font-size:1.03rem!important;line-height:1.42!important}.options{height:auto!important;overflow:visible!important;gap:8px!important}.option{min-height:54px!important;padding:10px!important;font-size:1rem!important}.option small{display:block!important}.team-screen,.exhibit-review,.score,.debrief{height:auto!important;min-height:0!important;overflow:visible!important;padding:16px 12px 28px!important}.team-head,.scoretop,.results{grid-template-columns:1fr!important}.teamgrid,.reviewgrid,.scoregrid,.minirow,.team-feedback{grid-template-columns:1fr!important;height:auto!important;overflow:visible!important}.person{grid-template-columns:110px 1fr!important;grid-template-rows:auto!important}.person-art{width:110px!important;height:140px!important}.panel,.qcard,.teacher-note{height:auto!important;overflow:visible!important}.modalbox{max-height:82dvh!important;overflow:auto!important}`;d.head.appendChild(s);const stage=d.getElementById('stage');if(stage)new MutationObserver(()=>{d.body.scrollTop=0;d.documentElement.scrollTop=0;const p=d.querySelector('.startprompt');if(p)p.textContent='ΠΑΤΗΣΕ «ΕΠΙΛΟΓΗ» ΓΙΑ ΕΝΑΡΞΗ'}).observe(stage,{childList:true})}catch(e){console.error(e)}});</script><script src="museum-ui.js?v=1"></script></body></html>
